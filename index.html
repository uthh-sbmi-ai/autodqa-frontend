<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoDQA</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
         background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 8px 16px; border-bottom: 1px solid #21262d; display: flex; align-items: center; gap: 12px; }
  header b { color: #58a6ff; }
  /* The page h1. Reset the UA heading styles so it renders as the header line it
     always was — the <b> inside keeps its own weight. */
  .title { white-space: nowrap; font-size: inherit; font-weight: 400; margin: 0; }

  /* login inline in the header, centered between title and model */
  .mid { display: flex; align-items: center; gap: 10px; flex: 1; justify-content: center; flex-wrap: wrap; }
  .login { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .login input { padding: 5px 8px; font-size: 12px; width: 150px; min-height: 44px; }
  .login button { padding: 5px 10px; font-size: 12px; }
  .login .err { color: #f85149; font-size: 11px; }
  #who { color: #8b949e; font-size: 12px; }
  #model { color: #9aa1aa; font-size: 12px; white-space: nowrap; }

  input, textarea { background: #010409; border: 1px solid #30363d; color: #c9d1d9;
          padding: 8px 10px; border-radius: 6px; font: inherit; }
  /* 44x44 floor on every button — WCAG 2.5.5 Target Size (Enhanced), which is
     what SiteImprove's "enhanced size" check enforces. */
  button { background: #1a6327; border: 0; color: #fff; padding: 8px 14px; border-radius: 6px; font: inherit; cursor: pointer;
           min-height: 44px; min-width: 44px; }
  button:disabled { opacity: .5; cursor: wait; }

  /* two-pane body: architecture diagram left, chat right */
  #appBody { display: flex; flex: 1; min-height: 0; }
  .diagram-pane { width: clamp(340px, 34vw, 560px); border-right: 1px solid #21262d;
                  background: #0b0e13; overflow: auto; padding: 14px 14px 24px; }
  .diagram-pane h2 { font-size: 11px; color: #9aa1aa; margin: 0 0 4px; text-transform: uppercase; letter-spacing: .6px; }
  .cap { font-size: 12px; color: #9aa1aa; margin: 0 0 12px; min-height: 15px; transition: color .2s; }
  .cap.live { color: #58a6ff; font-weight: 500; }
  .arch-card { background: #0d1117; border: 1px solid #21262d; border-radius: 10px; padding: 8px; }
  .arch-svg { width: 100%; display: block; }
  .anode { transition: opacity .25s ease, filter .25s ease; }
  .arch-svg.running .anode { opacity: .32; }
  .anode.active { opacity: 1 !important; filter: drop-shadow(0 0 6px rgba(88,166,255,.85)) brightness(1.4) saturate(1.1); }

  .chatpanel { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 16px; }
  #stream { flex: 1; overflow-y: auto; padding-right: 6px; max-width: 900px; width: 100%; margin: 0 auto; }

  .msg { margin: 10px 0; display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg .bubble { padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; max-width: 82%; }
  .msg.user .bubble { background: #1f2d45; border: 1px solid #2f4067; border-bottom-right-radius: 4px; }
  .msg.agent .bubble { background: #12161c; border: 1px solid #21262d; border-left: 3px solid #2ea043; border-bottom-left-radius: 4px; }

  details.tool { background: #0f1620; border: 1px solid #21313f; border-radius: 8px; margin: 8px 0; }
  details.tool summary { cursor: pointer; padding: 8px 12px; color: #58a6ff; list-style: none; }
  details.tool summary::-webkit-details-marker { display: none; }
  details.tool pre { margin: 0; padding: 10px 12px; overflow-x: auto; font-size: 12.5px;
                     border-top: 1px solid #21313f; white-space: pre-wrap; word-break: break-word; }
  details.tool pre.result { color: #7ee787; max-height: 260px; overflow-y: auto; }

  .line { margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
  .line.result { color: #8b949e; }
  .line.error { color: #f85149; }
  .line.sandbox { color: #58a6ff; font-size: 12px; opacity: .9; }
  .line.done { color: #3fb950; font-size: 12px; }
  .line.error { white-space: pre-wrap; }   /* multi-line stop reasons */
  .status { color: #8b949e; margin: 8px 0; font-size: 13px; }
  .spinner { display: inline-block; width: 11px; height: 11px; border: 2px solid #30363d;
             border-top-color: #58a6ff; border-radius: 50%; animation: spin .8s linear infinite;
             vertical-align: -1px; margin-right: 7px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  form#taskForm { display: flex; gap: 8px; margin-top: 8px; max-width: 900px; width: 100%; margin-left: auto; margin-right: auto; }
  #task { flex: 1; resize: none; height: 60px; }

  @media (max-width: 940px) { .diagram-pane { display: none; } }
</style>
</head>
<body>
  <header>
    <h1 class="title"><b>AutoDQA</b> — data-quality agent</h1>
    <span class="mid">
      <span class="login" id="login">
        <input id="email" type="email" placeholder="email" autocomplete="username">
        <input id="password" type="password" placeholder="password" autocomplete="current-password">
        <button id="loginBtn">Sign in</button>
        <span class="err" id="loginErr"></span>
      </span>
      <span id="who"></span>
    </span>
    <span id="model"></span>
  </header>

  <div id="appBody" hidden>
    <aside class="diagram-pane">
      <h2>Architecture</h2>
      <p class="cap" id="archStep">The active path lights up as the agent runs.</p>
      <div class="arch-card">
        <svg class="arch-svg" viewBox="150 30 550 670" role="img"
             aria-labelledby="archTitle" aria-describedby="archDesc" xmlns="http://www.w3.org/2000/svg">
          <!-- role="img" collapses the diagram to a single object, so screen readers
               never reach the <text> labels inside it — the description below has to
               carry the whole flow. Keep it in step with the diagram if either changes. -->
          <title id="archTitle">AutoDQA architecture: the eight-step agent loop</title>
          <desc id="archDesc">Flow diagram of the AutoDQA stack. The AgentCore Runtime,
            running the LangGraph agent loop, sits at the middle of the chain. Step 1, it
            sends context input to the Cloudflare AI Gateway, which applies access policies,
            audit logging and DLP, and which exchanges requests with Amazon Bedrock for
            model inference. Step 2, the model response returns to the Runtime. Step 3, the
            Runtime sends an execution request to the AgentCore Gateway, which enforces tool
            and dataset allowlists, consults the Dataset Registry, and retrieves credentials
            from AWS Secrets Manager. Step 4, the Gateway dispatches the code to the Lambda
            MicroVM sandbox with credentials injected; that sandbox is created and destroyed
            per session, runs code under control, and has managed egress. Step 5, the sandbox
            issues read-only T-SQL to the CDW SQL Server database and, step 6, receives rows
            back; it also reads the Documentation Store of ETL code and docs. Step 7, stdout
            and results return to the AgentCore Gateway, and step 8, the result returns to the
            Runtime, which loops until the model produces a final answer. While the agent runs,
            each node highlights as it becomes active.</desc>
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
            <mask id="arch-gaps" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="700" height="880" fill="white"/><rect x="296.9" y="51.2" width="158.7" height="21.6" fill="black" rx="2"/><rect x="286.8" y="72.4" width="177.9" height="19.2" fill="black" rx="2"/><rect x="360.4" y="90.4" width="31.8" height="19.2" fill="black" rx="2"/><rect x="331.7" y="413.2" width="89.0" height="21.6" fill="black" rx="2"/><rect x="304.5" y="438.4" width="143.1" height="19.2" fill="black" rx="2"/><rect x="306.5" y="569.2" width="139.3" height="21.6" fill="black" rx="2"/><rect x="277.1" y="592.4" width="198.0" height="19.2" fill="black" rx="2"/><rect x="297.4" y="610.4" width="157.1" height="19.2" fill="black" rx="2"/><rect x="325.5" y="628.4" width="101.9" height="19.2" fill="black" rx="2"/></mask>
          </defs>

          <g class="anode" data-id="aigw">
            <rect x="252" y="40" width="248" height="78" rx="10" style="fill:rgb(42,36,24);stroke:rgb(196,154,78);stroke-width:1.2px"/>
            <text x="376" y="62" text-anchor="middle" dominant-baseline="central" style="fill:rgb(236,214,164);font-size:14px;font-weight:500">Cloudflare AI Gateway</text>
            <text x="376" y="82" text-anchor="middle" dominant-baseline="central" style="fill:rgb(205,174,116);font-size:12px">Access policies · Audit logging</text>
            <text x="376" y="100" text-anchor="middle" dominant-baseline="central" style="fill:rgb(205,174,116);font-size:12px">DLP</text>
          </g>
          <g class="anode" data-id="bedrock">
            <rect x="540" y="40" width="148" height="78" rx="10" style="fill:rgb(42,32,26);stroke:rgb(204,122,84);stroke-width:1.2px"/>
            <text x="614" y="62" text-anchor="middle" dominant-baseline="central" style="fill:rgb(238,191,166);font-size:14px;font-weight:500">Amazon Bedrock</text>
            <text x="614" y="82" text-anchor="middle" dominant-baseline="central" style="fill:rgb(210,150,111);font-size:12px">Model inference</text>
            <text x="614" y="100" text-anchor="middle" dominant-baseline="central" style="fill:rgb(210,150,111);font-size:12px">HIPAA eligible</text>
          </g>
          <line x1="500" y1="72" x2="538" y2="72" marker-end="url(#arrow)" style="fill:none;stroke:rgb(116,115,126);stroke-width:1.5px"/>
          <line x1="538" y1="88" x2="500" y2="88" marker-end="url(#arrow)" style="fill:none;stroke:rgb(116,115,126);stroke-width:1.5px"/>

          <g class="anode" data-id="orchestrator">
            <rect x="252" y="228" width="248" height="80" rx="10" style="fill:rgb(22,48,42);stroke:rgb(62,160,136);stroke-width:1.2px"/>
            <text x="376" y="262" text-anchor="middle" dominant-baseline="central" style="fill:rgb(155,224,203);font-size:14px;font-weight:500">AgentCore Runtime</text>
            <text x="376" y="284" text-anchor="middle" dominant-baseline="central" style="fill:rgb(105,194,170);font-size:12px">LangGraph agent loop</text>
          </g>

          <text x="312" y="174" text-anchor="middle" style="fill:rgb(138,135,148);font-size:12px">1 · context input</text>
          <line x1="342" y1="228" x2="342" y2="120" marker-end="url(#arrow)" mask="url(#arch-gaps)" style="fill:none;stroke:rgb(116,115,126);stroke-width:1.5px"/>
          <text x="432" y="174" text-anchor="middle" style="fill:rgb(138,135,148);font-size:12px">2 · model response</text>
          <line x1="417" y1="120" x2="417" y2="228" marker-end="url(#arrow)" mask="url(#arch-gaps)" style="fill:none;stroke:rgb(116,115,126);stroke-width:1.5px"/>

          <g class="anode" data-id="broker">
            <rect x="252" y="396" width="248" height="80" rx="10" style="fill:rgb(23,38,56);stroke:rgb(79,147,207);stroke-width:1.2px"/>
            <text x="376" y="424" text-anchor="middle" dominant-baseline="central" style="fill:rgb(166,206,240);font-size:14px;font-weight:500">AgentCore Gateway</text>
            <text x="376" y="448" text-anchor="middle" dominant-baseline="central" style="fill:rgb(118,174,222);font-size:12px">Tool + dataset allowlists</text>
          </g>

          <text x="304" y="338" text-anchor="end" style="fill:rgb(138,135,148);font-size:12px">3 · execution request</text>
          <line x1="342" y1="308" x2="342" y2="394" marker-end="url(#arrow)" style="fill:none;stroke:rgb(116,115,126);stroke-width:1.5px"/>
          <text x="414" y="338" text-anchor="start" style="fill:rgb(138,135,148);font-size:12px">8 · result</text>
          <line x1="410" y1="394" x2="410" y2="308" marker-end="url(#arrow)" mask="url(#arch-gaps)" style="fill:none;stroke:rgb(116,115,126);stroke-width:1.5px"/>

          <g class="anode" data-id="registry">
            <rect x="540" y="392" width="148" height="50" rx="10" style="fill:rgb(32,32,42);stroke:rgb(74,74,86);stroke-width:1.2px;stroke-dasharray:5px,4px"/>
            <text x="614" y="417" text-anchor="middle" dominant-baseline="central" style="fill:rgb(212,210,218);font-size:14px;font-weight:500">Dataset Registry</text>
          </g>
          <text x="520" y="406" text-anchor="middle" style="fill:rgb(138,135,148);font-size:12px">consults</text>
          <line x1="500" y1="417" x2="538" y2="417" marker-end="url(#arrow)" style="fill:none;stroke:rgb(116,115,126);stroke-width:1.5px;stroke-dasharray:5px,4px"/>

          <g class="anode" data-id="vault">
            <rect x="540" y="458" width="148" height="50" rx="10" style="fill:rgb(32,32,42);stroke:rgb(74,74,86);stroke-width:1.2px;stroke-dasharray:5px,4px"/>
            <text x="614" y="478" text-anchor="middle" dominant-baseline="central" style="fill:rgb(212,210,218);font-size:14px;font-weight:500">Secrets Manager</text>
            <text x="614" y="494" text-anchor="middle" dominant-baseline="central" style="fill:rgb(138,135,148);font-size:12px">AWS</text>
          </g>
          <text x="520" y="472" text-anchor="middle" style="fill:rgb(138,135,148);font-size:12px">retrieves</text>
          <line x1="500" y1="483" x2="538" y2="483" marker-end="url(#arrow)" style="fill:none;stroke:rgb(116,115,126);stroke-width:1.5px;stroke-dasharray:5px,4px"/>

          <g class="anode" data-id="sandbox">
            <rect x="252" y="556" width="248" height="100" rx="10" style="fill:rgb(32,32,58);stroke:rgb(130,120,216);stroke-width:1.2px"/>
            <text x="376" y="580" text-anchor="middle" dominant-baseline="central" style="fill:rgb(196,188,242);font-size:14px;font-weight:500">Lambda MicroVM sandbox</text>
            <text x="376" y="602" text-anchor="middle" dominant-baseline="central" style="fill:rgb(162,150,214);font-size:12px">Per-session microVM create / delete</text>
            <text x="376" y="620" text-anchor="middle" dominant-baseline="central" style="fill:rgb(162,150,214);font-size:12px">Controlled code execution</text>
            <text x="376" y="638" text-anchor="middle" dominant-baseline="central" style="fill:rgb(162,150,214);font-size:12px">Managed egress</text>
          </g>

          <text x="304" y="508" text-anchor="end" style="fill:rgb(138,135,148);font-size:12px">4 · dispatch + inject creds</text>
          <line x1="342" y1="476" x2="342" y2="554" marker-end="url(#arrow)" style="fill:none;stroke:rgb(116,115,126);stroke-width:1.5px"/>
          <text x="414" y="508" text-anchor="start" style="fill:rgb(138,135,148);font-size:12px">7 · stdout / results</text>
          <line x1="410" y1="554" x2="410" y2="476" marker-end="url(#arrow)" mask="url(#arch-gaps)" style="fill:none;stroke:rgb(116,115,126);stroke-width:1.5px"/>

          <g class="anode" data-id="cdw">
            <rect x="540" y="554" width="148" height="56" rx="10" style="fill:rgb(31,42,20);stroke:rgb(118,164,62);stroke-width:1.2px"/>
            <text x="614" y="574" text-anchor="middle" dominant-baseline="central" style="fill:rgb(191,224,146);font-size:14px;font-weight:500">CDW · SQL Server</text>
            <text x="614" y="592" text-anchor="middle" dominant-baseline="central" style="fill:rgb(147,187,99);font-size:12px">Read-only</text>
          </g>
          <g class="anode" data-id="docstore">
            <rect x="540" y="634" width="148" height="56" rx="10" style="fill:rgb(32,32,42);stroke:rgb(74,74,86);stroke-width:1.2px"/>
            <text x="614" y="654" text-anchor="middle" dominant-baseline="central" style="fill:rgb(212,210,218);font-size:14px;font-weight:500">Documentation Store</text>
            <text x="614" y="672" text-anchor="middle" dominant-baseline="central" style="fill:rgb(138,135,148);font-size:12px">ETL code · docs</text>
          </g>
          <text x="520" y="554" text-anchor="middle" style="fill:rgb(138,135,148);font-size:12px">5 · read-only T-SQL</text>
          <line x1="500" y1="590" x2="538" y2="578" marker-end="url(#arrow)" style="fill:none;stroke:rgb(116,115,126);stroke-width:1.5px"/>
          <text x="512" y="624" text-anchor="middle" style="fill:rgb(138,135,148);font-size:12px">6 · rows</text>
          <line x1="538" y1="594" x2="500" y2="606" marker-end="url(#arrow)" style="fill:none;stroke:rgb(116,115,126);stroke-width:1.5px"/>
          <text x="520" y="662" text-anchor="middle" style="fill:rgb(138,135,148);font-size:12px">reads</text>
          <line x1="500" y1="634" x2="538" y2="658" marker-end="url(#arrow)" mask="url(#arch-gaps)" style="fill:none;stroke:rgb(116,115,126);stroke-width:1.5px"/>
        </svg>
      </div>
    </aside>

    <!-- <main>, not a div: the chat column is the primary content, and without a
         landmark its text (the Run button, the task placeholder) sits outside the
         landmark structure entirely. The diagram beside it is <aside>/complementary. -->
    <main class="chatpanel">
      <div id="stream"></div>
      <form id="taskForm">
        <textarea id="task" placeholder="Give the agent a data-quality task…  (Enter to send, Shift+Enter for newline)"></textarea>
        <button id="send" type="submit">Run</button>
      </form>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
